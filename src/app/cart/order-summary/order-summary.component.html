<div *ngIf="summary">
    <h2>Order Summary</h2>
    <hr />
    <p>Subtotal: <span class="subtotal">₹{{summary.subTotal}}</span></p>
    <p>Taxes: <span class="tax">₹{{summary.tax}}</span></p>
    <p>Total price to Pay: <span class="tax">₹{{summary.totalValue}}</span></p>
    <button class="checkout-button">Proceed to Checkout</button>
</div>
